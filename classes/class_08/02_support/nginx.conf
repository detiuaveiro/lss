events {
    worker_connections 1024;
}

http {
    upstream university_services {
        server 172.25.0.40:5432;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://university_services;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
