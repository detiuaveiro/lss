<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - My Portfolio</title>
    <!-- SEO meta tags -->
    <meta name="description" content="Contact page for My Portfolio. Get in touch via email or the contact form.">
    <meta name="keywords" content="portfolio, contact, web development, student">
    <meta name="author" content="Your Name">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Contact</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Get in Touch</h2>
            <form aria-label="Contact form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="30" required></textarea><br><br>
                <button type="submit">Send</button>
            </form>
            <p>
                Or email me directly: <a href="mailto:your.email@example.com">your.email@example.com</a>
            </p>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Your Name</p>
    </footer>
</body>
</html>
